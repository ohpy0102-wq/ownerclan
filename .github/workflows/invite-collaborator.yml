name: Invite Collaborator

on:
  push:
    branches:
      - copilot/collaborator-invitation-email
  workflow_dispatch:

permissions:
  administration: write

jobs:
  invite:
    runs-on: ubuntu-latest
    steps:
      - name: Invite qudansdl as collaborator
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const result = await github.rest.repos.addCollaborator({
                owner: context.repo.owner,
                repo: context.repo.repo,
                username: 'qudansdl',
                permission: 'push'
              });
              console.log('Successfully sent collaborator invitation to qudansdl, status:', result.status);
            } catch (error) {
              if (error.status === 422) {
                console.log('qudansdl is already a collaborator');
              } else {
                console.log('Error status:', error.status);
                console.log('Error message:', error.message);
                throw error;
              }
            }
